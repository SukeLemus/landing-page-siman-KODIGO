<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almacenes Siman El Salvador | Ofertas y Eventos Exclusivos</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body class="gradient-siman">
    <header class="header-landing">
      <!-- Barra promocional superior -->
      <aside class="top-bar">
        <i class="fas fa-store icon-tienda"></i>
        <p class="top-bar-text">
          Encuentra tu sucursal en El Salvador: Galerias, Metrocentro, Plaza
          Mundo, San Miguel y Santa Ana
        </p>
        <div class="top-bar-badge">¡SÚPER CONVIENE!</div>
        <p class="top-bar-text">
          Envío gratis por compras mayores a $50 en San Salvador.
        </p>
      </aside>
    </header>

    <!-- Barra de navegación principal -->
    <nav class="main-navbar">
      <div class="navbar-container">
        <!-- Logo -->
        <a href="#" class="logo-link">
          <div class="logo-badge">
            SIMAN<span class="logo-country">.SV</span>
          </div>
        </a>
        <!-- Menú de opciones central -->
        <ul class="nav-links">
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Categorías</a></li>
          <li><a href="#">Ofertas</a></li>
          <li><a href="#">Novedades</a></li>
          <li><a href="#">Contacto</a></li>
        </ul>
        <!-- Indicador o espacio derecho (ej. punto de estatus o ícono) -->
        <div class="navbar-right">
          <span class="status-dot">soy un indicador </span>
        </div>
      </div>
    </nav>
  </body>
</html>
